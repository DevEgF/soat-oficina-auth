name: destroy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [hml, prod]
        required: true
      confirmation:
        description: Type DESTROY-soat-oficina-auth
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: auth-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_IN_AUTOMATION: true
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate typed confirmation
        run: test "$CONFIRMATION" = DESTROY-soat-oficina-auth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform -chdir=infra init -input=false -backend-config="bucket=${TF_VAR_state_bucket}" -backend-config="region=${AWS_REGION}" -backend-config="key=auth/${TF_VAR_environment}/terraform.tfstate"
      - run: terraform -chdir=infra plan -destroy -input=false -out=destroy.tfplan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-destroy-${{ inputs.environment }}-${{ github.run_id }}
          path: infra/destroy.tfplan
          retention-days: 7
          if-no-files-found: error
      - run: terraform -chdir=infra apply -input=false destroy.tfplan
