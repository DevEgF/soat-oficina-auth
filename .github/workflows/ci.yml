name: auth
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
env:
  TF_IN_AUTOMATION: true
jobs:
  node-check:
    name: auth / node-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
          POSTGRES_DB: oficina
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U oficina' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://oficina:oficina@localhost:5432/oficina
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  terraform:
    name: auth / terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - run: terraform -chdir=infra/shared init -backend=false -input=false
      - run: terraform -chdir=infra/shared validate
      - run: terraform -chdir=infra/shared test
  security:
    name: auth / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.0
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init && tflint --chdir=infra && tflint --chdir=infra/shared
      - run: |
          python3 -m venv "${RUNNER_TEMP}/checkov"
          "${RUNNER_TEMP}/checkov/bin/python" -m pip install checkov==3.3.16
          "${RUNNER_TEMP}/checkov/bin/checkov" -d infra --framework terraform --quiet
