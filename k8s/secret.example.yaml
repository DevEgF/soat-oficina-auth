# SÓ DOCUMENTAÇÃO: fora do kustomization.yaml e sem valores reais.
# O Secret de verdade é criado por soat-oficina-infra-k8s/local/secrets.sh a partir do .env.local.
#
# APP_JWT_SECRET tem de ser igual ao do OS Service (mínimo de 32 bytes): o OS valida com ele o
# token do cliente e o token interno que este serviço usa para consultar clientes.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: oficina
type: Opaque
stringData:
  APP_JWT_SECRET: "CHANGE_ME_min_32_bytes_openssl_rand_hex_32"
